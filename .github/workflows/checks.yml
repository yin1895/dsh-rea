name: checks

# The behaviour tests need a REA installation and a machine-specific config file,
# so CI covers the packaging contract and the bridge's disclosure guarantee: it
# installs rea-agents, then asserts the handshake works and that the full catalog
# is not advertised.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check lib/core.js
          node --check lib/index.js
          node --check lib/client.js
          node --check bridge/index.mjs
          node --check test/run.mjs
          node --check test/http.mjs
          node --check test/client.mjs

      - name: Packaging contract
        run: npm run check

      - name: Install REA
        run: npm install --global rea-agents@latest

      - name: Bridge handshake and disclosure
        run: node scripts/check-bridge-stdio.mjs --require-rea --timeout-ms 180000